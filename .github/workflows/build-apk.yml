
name: Build RC Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Check required files
        run: |
          if [ ! -f capacitor.config.json ] && [ -f capacitor_config.json ]; then
            mv capacitor_config.json capacitor.config.json
            echo "Renamed capacitor_config.json -> capacitor.config.json"
          fi
          missing=0
          for f in index.html package.json capacitor.config.json voice-bridge-entry.js va-nlu.js va-io.js va-app.js va-core.js va-ui.js; do
            if [ ! -f "$f" ]; then echo "::error::Missing file in repo root: $f"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi
          if ! grep -q "voice-bridge.js" index.html; then
            echo "::warning::index.html mein voice-bridge.js ka script tag nahi mila - native mic/voice kaam nahi karega"
          fi
          echo "All required files present."

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run voice engine tests (only if the tests folder was uploaded)
        run: |
          if [ -f tests/nlu-quick.js ] && [ -f tests/va-tests.js ]; then
            node tests/nlu-quick.js
            node tests/va-tests.js
          else
            echo "tests folder not uploaded - skipping tests"
          fi

      - name: Prepare web assets and bundle native voice bridge
        run: |
          mkdir -p www
          cp index.html va-*.js www/
          for f in manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; else echo "optional file missing, skipped: $f"; fi
          done
          npm run build:voice

      - name: Add Android platform
        run: npx cap add android

      - name: Patch generated AndroidManifest (speech services + microphone)
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          if (!fs.existsSync(p)) { console.error('Manifest not found: ' + p); process.exit(1); }
          let x = fs.readFileSync(p, 'utf8');

          let add = '';
          ['android.permission.INTERNET',
           'android.permission.RECORD_AUDIO',
           'android.permission.MODIFY_AUDIO_SETTINGS'].forEach(function (n) {
            if (x.indexOf('android:name="' + n + '"') === -1)
              add += '    <uses-permission android:name="' + n + '" />\n';
          });
          if (x.indexOf('android.hardware.microphone') === -1)
            add += '    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n';

          const actions = ['android.speech.RecognitionService',
                           'android.intent.action.TTS_SERVICE',
                           'android.speech.tts.engine.INSTALL_TTS_DATA'];
          const need = actions.filter(function (a) { return x.indexOf('android:name="' + a + '"') === -1; });
          const intents = need.map(function (a) {
            return '        <intent><action android:name="' + a + '" /></intent>\n';
          }).join('');

          if (intents) {
            if (/<\/queries>/.test(x)) {
              x = x.replace('</queries>', intents + '    </queries>');
            } else {
              add += '    <queries>\n' + intents + '    </queries>\n';
            }
          }

          if (add) {
            if (!/<\/manifest>/.test(x)) { console.error('Invalid manifest (no </manifest>)'); process.exit(1); }
            x = x.replace('</manifest>', add + '</manifest>');
          }
          fs.writeFileSync(p, x);
          console.log('Manifest patched. Added: ' + (add ? 'yes' : 'nothing (already patched)'));
          NODE
          echo "----- AndroidManifest.xml -----"
          cat android/app/src/main/AndroidManifest.xml

      - name: Generate Android launcher icons
        continue-on-error: true
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android --iconBackgroundColor '#06080e' --iconBackgroundColorDark '#06080e' --splashBackgroundColor '#06080e' --splashBackgroundColorDark '#06080e'
          else
            echo "assets/icon.png not found - default launcher icon will be used"
          fi

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Force Java 17 in native plugins (fix invalid source release 21)
        run: |
          for f in node_modules/@capacitor-community/*/android/build.gradle node_modules/@capacitor/*/android/build.gradle; do
            [ -f "$f" ] || continue
            sed -i -E 's/VERSION_(1[89]|2[0-9])/VERSION_17/g; s/(sourceCompatibility|targetCompatibility)[ =]+"?(1[89]|2[0-9])"?/\1 JavaVersion.VERSION_17/g; s/jvmTarget *= *"?(1[89]|2[0-9])"?/jvmTarget = "17"/g' "$f"
            echo "== $f"; grep -nE "Compatibility|jvmTarget|VERSION_" "$f" || true
          done
          if grep -rnE "VERSION_(1[89]|2[0-9])" node_modules/@capacitor-community/*/android/build.gradle; then
            echo "::error::Plugin still requests Java > 17"; exit 1
          fi

      - name: Verify speech plugins and web files
        run: |
          npm ls @capacitor-community/speech-recognition --depth=0
          npm ls @capacitor-community/text-to-speech --depth=0
          test -s www/voice-bridge.js
          grep -q RCTextToSpeech www/voice-bridge.js
          grep -q RCSpeechRecognition www/voice-bridge.js
          for f in va-nlu va-io va-app va-core va-ui; do test -s www/$f.js; done
          test -d node_modules/@capacitor-community/speech-recognition/android
          test -d node_modules/@capacitor-community/text-to-speech/android
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml
          grep -q RecognitionService android/app/src/main/AndroidManifest.xml
          echo "Plugins, bridge, voice modules and manifest entries are present."

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RC-Trading-Journal-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
